<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>biohacker.fun - 生物黑客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.25rem;
      color: #888;
      margin-bottom: 3rem;
    }
    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .link {
      color: #00ff88;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid #00ff8855;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .link:hover {
      background: #00ff8822;
      border-color: #00ff88;
    }
    .status {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #555;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>biohacker.fun</h1>
    <p class="tagline">生物黑客 · DIY 生物技术 · 个人量化生命实验</p>
    <div class="links">
      <a href="#" class="link">实验日志</a>
      <a href="#" class="link">量化指标</a>
      <a href="#" class="link">工具链</a>
      <a href="#" class="link">关于</a>
    </div>
    <div class="status">
      <span class="pulse"></span>系统上线中
    </div>
  </div>
</body>
</html>
